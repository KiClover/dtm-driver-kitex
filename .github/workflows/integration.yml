name: integration

on:
  schedule:
    - cron: '0 3 * * *' # daily; full DTM Saga recovery E2E
  workflow_dispatch:

jobs:
  dtm-saga-e2e:
    # Full vertical slice: real DTM server configured with this driver via
    # kitex-etcd, driving raw-payload Saga recovery and compensation against
    # a Kitex branch service, backed by MySQL + etcd.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports: ['3306:3306']
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dtm
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.17
        ports: ['2379:2379']
        env:
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
        options: >-
          --health-cmd "etcdctl endpoint health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build DTM server with the Kitex driver
        run: |
          git clone --depth 1 --branch feat/dtm-driver-kitex https://github.com/KiClover/dtm.git ../dtm
          cd ../dtm
          go mod edit -replace=github.com/dtm-labs/dtmdriver-kitex=${{ github.workspace }}
          go build -o ${{ github.workspace }}/integration/dtm_server/dtm-server .
      - name: Prepare DTM schema
        working-directory: integration/dtm_server
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot dtm < sqls/dtmsvr.storage.mysql.sql
      - name: Start DTM server
        working-directory: integration/dtm_server
        run: |
          sed -i 's/3307/3306/' conf.yaml
          ./dtm-server -c conf.yaml &> dtm.log &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:36789/api/dtmsvr/query?gid=probe && break || sleep 1
          done
      - name: Run Saga E2E
        run: go test ./integration -run 'TestSaga' -count=1 -v -timeout=20m
      - name: Upload DTM server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtm-server-log
          path: integration/dtm_server/dtm.log
