name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "unformatted files:" $unformatted
            exit 1
          fi
      - run: go vet ./...

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1

  direct-e2e:
    # Raw-payload direct connection E2E needs no external services.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run 'TestDirect|TestDTMStatusMatrix' -count=1 -timeout=10m

  registry-e2e:
    # etcd / Consul / Nacos container integration.
    runs-on: ubuntu-latest
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.17
        ports: ['2379:2379']
        env:
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
        options: >-
          --health-cmd "etcdctl endpoint health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      consul:
        image: hashicorp/consul:1.20
        ports: ['8500:8500']
        cmd: ['agent', '-dev', '-client=0.0.0.0']
      nacos:
        image: nacos/nacos-server:v2.2.3
        ports: ['8848:8848', '9848:9848']
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run 'TestEtcd|TestConsul|TestNacos' -count=1 -timeout=15m
