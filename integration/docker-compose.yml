# Dedicated registry for the Gate C integration tests
# (go test ./integration -run TestEtcd). The tests skip automatically when
# nothing answers on 127.0.0.1:12380.
services:
  etcd:
    image: etcd:v3.5.17
    container_name: dtm-kitex-test-etcd
    command:
      - etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:12380
    ports:
      - "12380:2379"
