# Dedicated registries for the integration tests
# (go test ./integration -run 'TestEtcd|TestConsul|TestNacos'). The tests skip
# automatically when nothing answers on the mapped ports.
services:
  etcd:
    image: etcd:v3.5.17
    container_name: dtm-kitex-test-etcd
    command:
      - etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:12380
    ports:
      - "12380:2379"

  consul:
    image: hashicorp/consul:1.20
    container_name: dtm-kitex-test-consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "18500:8500"

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: dtm-kitex-test-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    # 9848 is the v2 gRPC port (+1000 offset from 8848): explicit for nacos
    # 2.x SDKs even though the v1.x HTTP SDK used here only needs 8848.
    ports:
      - "8848:8848"
      - "9848:9848"

