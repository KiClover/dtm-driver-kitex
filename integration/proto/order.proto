syntax = "proto3";

package order;

// The Kitex generator requires the go_package to sit directly under
// <module>/kitex_gen. It is generated there and then moved to
// integration/kitex_gen, with imports rewritten — see the README for the
// exact regeneration recipe.
option go_package = "github.com/dtm-labs/dtmdriver-kitex/kitex_gen/order";

// CreateRequest carries the minimum a DTM branch call needs to prove the
// wire path: an idempotency key and a status to report back.
message CreateRequest {
  string order_id = 1;
  string amount = 2;
  string status = 3;
  // fail_with selects an injected error path in the negative tests. It is a
  // test-only field, never part of a production order contract.
  string fail_with = 4;
}

message CreateResponse {
  string order_id = 1;
  string status = 2;
  // barrier_gid echoes what the server read from DTM metadata so the client
  // can prove the metadata bridge delivered it.
  string barrier_gid = 3;
  string barrier_branch_id = 4;
  string barrier_op = 5;
}

service OrderService {
  rpc Create(CreateRequest) returns (CreateResponse);
}
